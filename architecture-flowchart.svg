<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title description">
  <title id="title">joChess application flowchart</title>
  <desc id="description">Startup and action selection branching into local play, loading a saved game, and network play. The diagram shows move validation and turn loops.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .lane-title { font-size: 19px; font-weight: 700; }
      .node-text { font-size: 16px; text-anchor: middle; }
      .edge-label { font-size: 14px; font-weight: 700; fill: #334155; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .process { fill: #fff; stroke: #334155; stroke-width: 2; rx: 12; }
      .decision { fill: #fff7d6; stroke: #a16207; stroke-width: 2; }
      .start-end { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="1400" fill="#f8fafc"/>
  <text x="700" y="35" class="title" text-anchor="middle">joChess — Application Flow</text>

  <rect x="20" y="290" width="430" height="1080" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="465" y="290" width="410" height="1080" rx="18" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="890" y="290" width="490" height="1080" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="235" y="323" class="lane-title" text-anchor="middle">Local game</text>
  <text x="670" y="323" class="lane-title" text-anchor="middle">Load saved game</text>
  <text x="1135" y="323" class="lane-title" text-anchor="middle">Network game</text>

  <ellipse cx="700" cy="75" rx="120" ry="31" class="start-end"/>
  <text x="700" y="81" class="node-text">Launch joChess</text>

  <rect x="585" y="130" width="230" height="58" class="process"/>
  <text x="700" y="165" class="node-text">Open main window</text>

  <polygon points="700,215 845,265 700,315 555,265" class="decision"/>
  <text x="700" y="260" class="node-text">
    <tspan x="700">Choose an</tspan>
    <tspan x="700" dy="20">action</tspan>
  </text>

  <path d="M700 106 V130" class="edge"/>
  <path d="M700 188 V213" class="edge"/>
  <path d="M590 278 H235 V350" class="edge"/>
  <text x="420" y="271" class="edge-label">New local game</text>
  <path d="M700 315 V350" class="edge"/>
  <text x="710" y="338" class="edge-label">Load game</text>
  <path d="M810 278 H1135 V350" class="edge"/>
  <text x="950" y="271" class="edge-label">Network game</text>

  <rect x="70" y="350" width="330" height="62" class="process"/>
  <text x="235" y="375" class="node-text">
    <tspan x="235">Configure players</tspan>
    <tspan x="235" dy="20">and options</tspan>
  </text>
  <rect x="70" y="445" width="330" height="62" class="process"/>
  <text x="235" y="470" class="node-text">
    <tspan x="235">Create game tab</tspan>
    <tspan x="235" dy="20">and initialize board</tspan>
  </text>
  <rect x="70" y="540" width="330" height="62" class="process"/>
  <text x="235" y="565" class="node-text">
    <tspan x="235">Select a piece</tspan>
    <tspan x="235" dy="20">and attempt a move</tspan>
  </text>
  <polygon points="235,615 330,665 235,715 140,665" class="decision"/>
  <text x="235" y="670" class="node-text">Legal move?</text>
  <rect x="70" y="750" width="330" height="62" class="process"/>
  <text x="235" y="775" class="node-text">
    <tspan x="235">Update board</tspan>
    <tspan x="235" dy="20">and move history</tspan>
  </text>
  <rect x="70" y="845" width="330" height="62" class="process"/>
  <text x="235" y="870" class="node-text">
    <tspan x="235">Switch active player</tspan>
    <tspan x="235" dy="20">and clock</tspan>
  </text>
  <path d="M235 412 V445" class="edge"/>
  <path d="M235 507 V540" class="edge"/>
  <path d="M235 602 V615" class="edge"/>
  <path d="M235 715 V750" class="edge"/>
  <text x="245" y="740" class="edge-label">Yes</text>
  <path d="M140 665 H45 V571 H68" class="edge"/>
  <text x="52" y="651" class="edge-label">No</text>
  <path d="M235 812 V845" class="edge"/>
  <path d="M400 876 H425 V571 H402" class="edge"/>
  <text x="300" y="930" class="edge-label">Next turn</text>
  <rect x="85" y="975" width="300" height="58" class="process"/>
  <text x="235" y="1010" class="node-text">Optional: save game file</text>
  <path d="M70 781 H45 V1004 H83" class="optional"/>
  <text x="54" y="965" class="edge-label">Save</text>

  <rect x="505" y="370" width="330" height="62" class="process"/>
  <text x="670" y="395" class="node-text">
    <tspan x="670">Select saved</tspan>
    <tspan x="670" dy="20">game file</tspan>
  </text>
  <rect x="505" y="465" width="330" height="62" class="process"/>
  <text x="670" y="490" class="node-text">
    <tspan x="670">Read player names</tspan>
    <tspan x="670" dy="20">and moves</tspan>
  </text>
  <rect x="505" y="560" width="330" height="72" class="process"/>
  <text x="670" y="587" class="node-text">
    <tspan x="670">Create game tab</tspan>
    <tspan x="670" dy="20">and restore move history</tspan>
  </text>
  <path d="M670 432 V465" class="edge"/>
  <path d="M670 527 V560" class="edge"/>
  <path d="M505 596 H470 V571 H402" class="edge"/>
  <text x="413" y="557" class="edge-label">Resume play</text>

  <rect x="950" y="350" width="370" height="62" class="process"/>
  <text x="1135" y="375" class="node-text">
    <tspan x="1135">Enter table, player</tspan>
    <tspan x="1135" dy="20">and connection details</tspan>
  </text>
  <polygon points="1135,430 1225,478 1135,526 1045,478" class="decision"/>
  <text x="1135" y="483" class="node-text">Host a table?</text>
  <rect x="950" y="555" width="370" height="62" class="process"/>
  <text x="1135" y="580" class="node-text">
    <tspan x="1135">Start server</tspan>
    <tspan x="1135" dy="20">and create table</tspan>
  </text>
  <rect x="950" y="650" width="370" height="62" class="process"/>
  <text x="1135" y="675" class="node-text">
    <tspan x="1135">Connect to server</tspan>
    <tspan x="1135" dy="20">over TCP</tspan>
  </text>
  <path d="M1135 412 V430" class="edge"/>
  <path d="M1135 526 V555" class="edge"/>
  <text x="1145" y="548" class="edge-label">Yes</text>
  <path d="M1045 478 H925 V681 H948" class="edge"/>
  <text x="950" y="468" class="edge-label">No, join</text>
  <path d="M1135 617 V650" class="edge"/>

  <polygon points="1135,725 1235,775 1135,825 1035,775" class="decision"/>
  <text x="1135" y="770" class="node-text">
    <tspan x="1135">Table and credentials</tspan>
    <tspan x="1135" dy="20">accepted?</tspan>
  </text>
  <path d="M1135 712 V725" class="edge"/>
  <rect x="925" y="850" width="190" height="58" class="process"/>
  <text x="1020" y="885" class="node-text">Show connection error</text>
  <path d="M1035 775 H920 V879 H923" class="edge"/>
  <text x="940" y="763" class="edge-label">No</text>
  <path d="M925 879 H905 V381 H948" class="edge"/>
  <text x="910" y="940" class="edge-label">Retry</text>

  <rect x="1155" y="850" width="190" height="58" class="process"/>
  <text x="1250" y="875" class="node-text">
    <tspan x="1250">Wait for both</tspan>
    <tspan x="1250" dy="19">players to join</tspan>
  </text>
  <path d="M1235 775 H1355 V879 H1347" class="edge"/>
  <text x="1260" y="763" class="edge-label">Yes</text>
  <rect x="950" y="940" width="370" height="62" class="process"/>
  <text x="1135" y="965" class="node-text">
    <tspan x="1135">Server sends game settings</tspan>
    <tspan x="1135" dy="20">to players and observers</tspan>
  </text>
  <path d="M1155 879 H1135 V940" class="edge"/>
  <rect x="950" y="1030" width="370" height="58" class="process"/>
  <text x="1135" y="1065" class="node-text">Player makes a move</text>
  <rect x="950" y="1115" width="370" height="58" class="process"/>
  <text x="1135" y="1150" class="node-text">Client sends move to server</text>
  <rect x="950" y="1200" width="370" height="58" class="process"/>
  <text x="1135" y="1235" class="node-text">Server relays move to peers</text>
  <rect x="950" y="1285" width="370" height="58" class="process"/>
  <text x="1135" y="1310" class="node-text">
    <tspan x="1135">Clients update board</tspan>
    <tspan x="1135" dy="19">and move history</tspan>
  </text>
  <path d="M1135 1002 V1030" class="edge"/>
  <path d="M1135 1088 V1115" class="edge"/>
  <path d="M1135 1173 V1200" class="edge"/>
  <path d="M1135 1258 V1285" class="edge"/>
  <path d="M1320 1314 H1360 V1059 H1322" class="edge"/>
  <text x="1324" y="1098" class="edge-label">Next turn</text>
</svg>
